name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

# Branch checks can be superseded; tag runs must finish publishing their release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

# What the About tab names (R130, ADR 0018): a pull request's own branch and last commit, not
# the merge with main that checkout builds and no branch has; a tag names no branch.
env:
  ORQWA_BRANCH: ${{ github.head_ref || (github.ref_type == 'branch' && github.ref_name || '') }}
  ORQWA_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  image:
    name: Dev image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # One image per Dockerfile (and the FFmpeg build script it runs): built the first time
      # that pair is seen, pulled after.
      - id: tag
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          hash="$(cat .devcontainer/Dockerfile scripts/build-ffmpeg.sh | sha256sum | cut -c1-16)"
          echo "tag=ghcr.io/$owner/orqwa-dev:$hash" >> "$GITHUB_OUTPUT"
      # A PR from a fork has a read-only token: it uses the image as it is, or the checks job
      # builds its own if the Dockerfile changed.
      - name: Build and push the image if GHCR lacks it
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "$TAG is there already"
            exit 0
          fi
          docker build -f .devcontainer/Dockerfile -t "$TAG" .
          docker push "$TAG"

  checks:
    name: Checks (dev container)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Reading the image the image job published; without, GHCR refuses the pull and every run
    # builds the image again.
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # The build directory and the crate registry carry over between runs, as
      # the devcontainer's volumes do for a developer: a cold build of the whole workspace takes
      # over ten minutes, a warm one seconds. The key is what decides the build: the toolchain
      # and FFmpeg (the image's inputs) and the dependencies (the lock file and the profiles);
      # not the runner's own Rust, which rust-cache would mix in and which varies between
      # runner images. Only a changed key saves: the dependencies are what is worth keeping.
      # Import Godot from the current checkout instead of restoring its previous project state.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: checks-v2-${{ hashFiles('.devcontainer/Dockerfile', 'scripts/build-ffmpeg.sh') }}-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml') }}
          restore-keys: |
            checks-v2-${{ hashFiles('.devcontainer/Dockerfile', 'scripts/build-ffmpeg.sh') }}-
      - name: Pull the dev image, or build it for a fork PR with a changed Dockerfile
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          docker pull "$IMAGE" || docker build -f .devcontainer/Dockerfile -t "$IMAGE" .
      # Without incremental compilation: a run compiles each changed crate once, and the build
      # directory stays small enough to cache.
      - name: fmt, clippy, test, deny, gdlint in the dev container
        run: |
          mkdir -p ~/.cargo/registry core/target app/.godot
          docker run --rm \
            -e CARGO_INCREMENTAL=0 \
            -e ORQWA_BRANCH \
            -e ORQWA_COMMIT \
            -v "$PWD:/workspaces/orqwa" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -w /workspaces/orqwa \
            "$IMAGE" scripts/check.sh
      # The container runs as root; the cache step must be able to read what it saves.
      - name: Hand the build directory back to the runner's user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" core/target app/.godot ~/.cargo/registry

  fuzz:
    name: Fuzz untrusted decoders (dev container)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            core/target
            core/fuzz/target
          key: fuzz-${{ hashFiles('.devcontainer/Dockerfile', 'scripts/build-ffmpeg.sh') }}-${{ hashFiles('core/Cargo.lock', 'core/fuzz/Cargo.lock') }}
          restore-keys: |
            fuzz-${{ hashFiles('.devcontainer/Dockerfile', 'scripts/build-ffmpeg.sh') }}-
      - name: Pull the dev image, or build it for a fork PR with a changed Dockerfile
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          docker pull "$IMAGE" || docker build -f .devcontainer/Dockerfile -t "$IMAGE" .
      # Thirty seconds per target catches shallow regressions on every change; the seeds start
      # each target from valid encodings, so even short runs reach deep into the formats.
      - name: Fuzz each target for thirty seconds
        run: |
          mkdir -p ~/.cargo/registry core/target core/fuzz/target
          docker run --rm \
            -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/workspaces/orqwa" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -w /workspaces/orqwa \
            "$IMAGE" scripts/fuzz.sh 30
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: core/fuzz/artifacts
          if-no-files-found: ignore
      - name: Hand the build directories back to the runner's user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" core/target core/fuzz ~/.cargo/registry

  macos:
    name: macOS app (arm64)
    # Docker on macOS has no Bluetooth/Metal, so macOS builds happen natively on the runner.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native music-control scripts
        run: |
          rustc --edition=2024 --test -D warnings core/orqwa-app/src/media/commands.rs -o "$RUNNER_TEMP/music-tests"
          "$RUNNER_TEMP/music-tests"
      - name: Check native microphone authorization bridge
        run: xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -fsyntax-only core/orqwa-gd/src/microphone_permission.m
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # FFmpeg's assembly needs nasm.
      - name: Install FFmpeg build tools
        run: brew install nasm cmake
      # FFmpeg's libraries, built once per release and platform (ADR 0010) and cached.
      - name: Test native group voice controls and disconnect diagnostics
        run: cargo test --manifest-path core/Cargo.toml -p orqwa-net --locked --lib lobby::tests
      - name: Test native voice jitter validation
        run: cargo test --manifest-path core/Cargo.toml -p orqwa-net --locked --lib voice::tests
      - name: Test native voice pacing and simulated conversations
        # Each conversation already stresses up to eight riders and owns real-time audio threads.
        run: cargo test --manifest-path core/Cargo.toml -p orqwa-voice --locked -- --test-threads=1
      - id: ffmpeg
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
      - run: echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
      - name: Build GDExtension
        run: scripts/build-gdext.sh release
      - name: Build CLI
        run: |
          cargo build --manifest-path core/Cargo.toml -p orqwa-cli --release --locked
          mkdir -p dist
          # Artifacts drop the executable bit; a tarball keeps it.
          cp core/orqwa-cli/notices/VOICE-LICENSES.txt core/target/release/
          tar -czf dist/orqwa-cli-macos-arm64.tar.gz -C core/target/release orqwa-cli VOICE-LICENSES.txt
      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates_dir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates_dir"
          unzip -q -j templates.tpz "templates/macos.zip" "templates/version.txt" -d "$templates_dir"
      - name: Export app
        run: |
          mkdir -p dist
          godot="$PWD/Godot.app/Contents/MacOS/Godot"
          # Godot 4.7.2 on macOS runners crashes in MoltenVK on a cold headless editor start
          # (godotengine/godot#123723), but only after .godot/ has been seeded; warm runs work.
          "$godot" --headless --path app --import || echo "Cold import crashed (known 4.7.2 issue), continuing"
          test -d app/.godot
          "$godot" --headless --path app --export-release "macOS" "$PWD/dist/ORQWA-macos-arm64.zip"
          test -s dist/ORQWA-macos-arm64.zip
      - name: Check exported microphone privacy metadata
        run: |
          ditto -x -k dist/ORQWA-macos-arm64.zip "$RUNNER_TEMP/macos-privacy"
          python3 scripts/release/macos_privacy.py "$RUNNER_TEMP/macos-privacy/ORQWA.app"
      # Both files are archives already; upload them as-is instead of zipping them again.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/ORQWA-macos-arm64.zip
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/orqwa-cli-macos-arm64.tar.gz
          archive: false

  windows:
    name: Windows app (x86_64)
    # Built natively with MSVC, like the macOS one: the extension is a Windows DLL with
    # Windows' Bluetooth behind it.
    runs-on: windows-latest
    # A cold build (FFmpeg plus the workspace) takes about 15 minutes.
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.2"
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native music-key helper
        run: |
          rustc --edition=2024 --test -D warnings core/orqwa-app/src/media/commands.rs -o "$env:RUNNER_TEMP\music-tests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\music-tests.exe"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # FFmpeg's build needs a POSIX sh, make and nasm: from the runner's preinstalled MSYS2.
      - name: Install FFmpeg build tools
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make diffutils nasm
      # The MSVC environment (cl.exe, link.exe, INCLUDE, LIB) for FFmpeg's configure
      # (--toolchain=msvc) comes from Visual Studio's own dev shell. PATH order: Visual Studio
      # first (its link.exe must win over coreutils' link), then MSYS2 (FFmpeg's makefiles need
      # MSYS2's make, sh and awk; other makes on the image mangle their quoting), then the rest.
      # Git's own sh and coreutils come out so the build uses one MSYS2 runtime (git.exe stays).
      # The steps after this one inherit the environment.
      - name: Set up the MSVC and MSYS2 environment
        run: |
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $paths = $env:PATH -split ';'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          $vsPaths = $env:PATH -split ';' | Where-Object { $_ -and $paths -notcontains $_ }
          $rest = $paths | Where-Object { $_ -and $_ -notmatch '\\Git\\(usr\\)?bin\\?$' }
          $env:PATH = (@($vsPaths) + 'C:\msys64\usr\bin' + @($rest)) -join ';'
          Get-ChildItem env: | Where-Object { $before[$_.Name] -ne $_.Value } |
            ForEach-Object { "$($_.Name)=$($_.Value)" } >> $env:GITHUB_ENV
          Get-Command cl, link, make, sh, awk, nasm | Format-Table Name, Source -AutoSize
      # FFmpeg's libraries, built once per release and platform (ADR 0010) and cached.
      - name: Test native group voice controls and disconnect diagnostics
        run: cargo test --manifest-path core/Cargo.toml -p orqwa-net --locked --lib lobby::tests
      - name: Test native voice jitter validation
        run: cargo test --manifest-path core/Cargo.toml -p orqwa-net --locked --lib voice::tests
      - name: Test native voice pacing and simulated conversations
        # Each conversation already stresses up to eight riders and owns real-time audio threads.
        run: cargo test --manifest-path core/Cargo.toml -p orqwa-voice --locked -- --test-threads=1
      - id: ffmpeg
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          sh scripts/build-ffmpeg.sh "$env:RUNNER_TEMP\ffmpeg"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: '"FFMPEG_DIR=$env:RUNNER_TEMP\ffmpeg" >> $env:GITHUB_ENV'
      - name: Build GDExtension and CLI
        run: |
          sh scripts/build-gdext.sh release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --manifest-path core/Cargo.toml -p orqwa-cli --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path core/target/release/orqwa-cli.exe,core/orqwa-cli/notices/VOICE-LICENSES.txt -DestinationPath dist/orqwa-cli-windows-x86_64.zip
      - name: Install Godot and export templates
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable"
          curl.exe -fsSL -o godot.zip "$base/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          Expand-Archive godot.zip -DestinationPath godot
          curl.exe -fsSL -o templates.zip "$base/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz"
          $templates = "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $templates | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("$PWD\templates.zip")
          foreach ($name in 'windows_release_x86_64.exe', 'version.txt') {
            $entry = $zip.GetEntry("templates/$name")
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$templates\$name", $true)
          }
          $zip.Dispose()
      # The console build blocks until Godot exits and forwards its output to the log.
      - name: Export app
        run: |
          $godot = "$PWD\godot\Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          & $godot --headless --path app --import
          New-Item -ItemType Directory -Force dist\ORQWA | Out-Null
          & $godot --headless --path app --export-release "Windows Desktop" "$PWD\dist\ORQWA\ORQWA.exe"
          if (-not (Test-Path dist\ORQWA\ORQWA.exe) -or -not (Test-Path dist\ORQWA\orqwa_gd.dll)) {
            Get-ChildItem dist\ORQWA
            throw "export is missing ORQWA.exe or orqwa_gd.dll"
          }
          # The icon and these details are written together; without them the .exe keeps the
          # template's, which Windows shows on the taskbar and in Explorer.
          $info = (Get-Item dist\ORQWA\ORQWA.exe).VersionInfo
          if ($info.ProductName -ne 'ORQWA') {
            $info | Format-List
            throw "ORQWA.exe kept the template's icon and details"
          }
          Compress-Archive dist\ORQWA\* dist\ORQWA-windows-x86_64.zip
      # The installer (ADR 0023), from the same export. WiX v7 asks each build to accept its
      # Open Source Maintenance Fee EULA; the fee applies only to users earning at least
      # US$10,000 a year, which ORQWA does not.
      - name: Build installer
        run: |
          dotnet tool install --global wix --version 7.0.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (Get-Item dist\ORQWA\ORQWA.exe).VersionInfo.ProductVersion
          wix build -acceptEula wix7 -arch x64 -d "Version=$version" -d "AppDir=dist\ORQWA" `
            scripts\release\ORQWA.wxs -o dist\ORQWA-windows-x86_64.msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Installs, checks what a rider gets and uninstalls again: a broken installer fails here,
      # not on a rider's computer.
      - name: Check installer
        run: |
          $msi = "$PWD\dist\ORQWA-windows-x86_64.msi"
          $installed = "$env:ProgramFiles\ORQWA"
          $shortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\ORQWA.lnk"
          $run = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log'
          if ($run.ExitCode) { Get-Content install.log -Tail 40; throw "install failed: $($run.ExitCode)" }
          foreach ($path in "$installed\ORQWA.exe", "$installed\orqwa_gd.dll", $shortcut) {
            if (-not (Test-Path $path)) { throw "not installed: $path" }
          }
          $run = Start-Process msiexec -Wait -PassThru -ArgumentList '/x', "`"$msi`"", '/qn'
          if ($run.ExitCode) { throw "uninstall failed: $($run.ExitCode)" }
          if (Test-Path "$installed\ORQWA.exe") { throw "uninstall left ORQWA.exe" }
      # Keep the installer identity stable so an installed ORQWA upgrades in place.
      - name: Check the upgrade from ORQWA 0.5.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.3 --repo "${{ github.repository }}" --pattern ORQWA-0.5.3-windows-x86_64.msi --dir previous
          $old = "$PWD\previous\ORQWA-0.5.3-windows-x86_64.msi"
          $msi = "$PWD\dist\ORQWA-windows-x86_64.msi"
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs"
          $run = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', "`"$old`"", '/qn'
          if ($run.ExitCode) { throw "Previous ORQWA install failed: $($run.ExitCode)" }
          if (-not (Test-Path "$env:ProgramFiles\ORQWA\ORQWA.exe")) { throw "Previous ORQWA not installed" }
          $run = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'upgrade.log'
          if ($run.ExitCode) { Get-Content upgrade.log -Tail 40; throw "upgrade failed: $($run.ExitCode)" }
          foreach ($path in "$env:ProgramFiles\ORQWA\ORQWA.exe", "$menu\ORQWA.lnk") {
            if (-not (Test-Path $path)) { throw "not installed by the upgrade: $path" }
          }
          $run = Start-Process msiexec -Wait -PassThru -ArgumentList '/x', "`"$msi`"", '/qn'
          if ($run.ExitCode) { throw "uninstall failed: $($run.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          path: dist/ORQWA-windows-x86_64.zip
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/ORQWA-windows-x86_64.msi
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/orqwa-cli-windows-x86_64.zip
          archive: false

  linux:
    name: Linux app (${{ matrix.arch }})
    # Built on the oldest supported runner rather than in the dev container (Debian 13): the
    # binaries need the glibc they were linked against or newer, so 22.04's lets them run on
    # Ubuntu 22.04+, Debian 12+ and their peers (ADR 0012).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            preset: Linux
          - arch: arm64
            runner: ubuntu-22.04-arm
            preset: Linux arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # The dev container's build packages: BlueZ's D-Bus for btleplug, libclang and nasm for
      # FFmpeg (ADR 0010), fontconfig for headless Godot.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config libclang-dev nasm libfontconfig1 libasound2-dev cmake
      # FFmpeg's libraries, built once per release and platform (ADR 0010) and cached.
      - id: ffmpeg
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
      - run: echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
      - name: Build GDExtension
        run: scripts/build-gdext.sh release
      - name: Build CLI
        run: |
          cargo build --manifest-path core/Cargo.toml -p orqwa-cli --release --locked
          mkdir -p dist
          # Artifacts drop the executable bit; a tarball keeps it.
          cp core/orqwa-cli/notices/VOICE-LICENSES.txt core/target/release/
          tar -czf "dist/orqwa-cli-linux-${{ matrix.arch }}.tar.gz" -C core/target/release orqwa-cli VOICE-LICENSES.txt
      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.${{ matrix.arch }}.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.${{ matrix.arch }}" godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates_dir"
          unzip -q -j templates.tpz "templates/linux_release.${{ matrix.arch }}" \
            "templates/version.txt" -d "$templates_dir"
      - name: Export app
        run: |
          ./godot --headless --path app --import
          mkdir -p dist/ORQWA
          ./godot --headless --path app --export-release "${{ matrix.preset }}" \
            "$PWD/dist/ORQWA/ORQWA.${{ matrix.arch }}"
          test -x "dist/ORQWA/ORQWA.${{ matrix.arch }}"
          test -s dist/ORQWA/liborqwa_gd.so
          tar -czf "dist/ORQWA-linux-${{ matrix.arch }}.tar.gz" -C dist ORQWA
      # The exported app itself, not the editor: it must start, load the extension and run the
      # main scene without errors on the oldest glibc it is built for.
      - name: Smoke test the exported app
        run: |
          # Captured first, shown whatever happens: with `set -e` a crash would otherwise end
          # the step before its output, and its cause, is seen.
          set +e
          output="$(dist/ORQWA/ORQWA.${{ matrix.arch }} --headless --quit-after 10 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "ORQWA exited with status $status" >&2
            if [ "$status" -gt 128 ]; then
              # A signal: run it again under gdb for the backtrace.
              sudo apt-get install -y --no-install-recommends gdb >/dev/null
              gdb -q -batch -ex run -ex bt -ex 'info sharedlibrary'                 --args "dist/ORQWA/ORQWA.${{ matrix.arch }}" --headless --quit-after 10 2>&1                 | tail -n 80
            fi
            exit 1
          fi
          if echo "$output" | grep -q "SCRIPT ERROR\|SHADER ERROR\|^ERROR:"; then
            echo "ORQWA reported errors" >&2
            exit 1
          fi
          echo "$output" | grep -q "^ORQWA "
          core/target/release/orqwa-cli --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          path: dist/ORQWA-linux-${{ matrix.arch }}.tar.gz
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/orqwa-cli-linux-${{ matrix.arch }}.tar.gz
          archive: false

  android:
    name: Android app (arm64)
    # Built in the Android image (ADR 0024): the dev image plus the SDK, NDK and Java, kept apart so
    # the dev image and the checks stay small. Runs beside the other builds.
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # The Android image is about 11 GB; the runner's own Android SDK, .NET and Haskell make room.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.gradle
            core/target
          key: android-${{ hashFiles('.devcontainer/Dockerfile', 'scripts/build-ffmpeg.sh', 'android/Dockerfile') }}-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml') }}
          restore-keys: |
            android-${{ hashFiles('.devcontainer/Dockerfile', 'scripts/build-ffmpeg.sh', 'android/Dockerfile') }}-
      # One Android image per dev image and Android Dockerfile, like the dev image: built the first
      # time that pair is seen, pulled after. A fork PR builds its own and pushes nothing.
      - name: Pull the Android image, or build it
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          hash="$(printf '%s' "$IMAGE" | cat - android/Dockerfile | sha256sum | cut -c1-16)"
          tag="ghcr.io/$owner/orqwa-android:$hash"
          echo "ANDROID_IMAGE=$tag" >> "$GITHUB_ENV"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          if docker pull "$tag"; then exit 0; fi
          docker pull "$IMAGE" || docker build -f .devcontainer/Dockerfile -t "$IMAGE" .
          docker build -f android/Dockerfile --build-arg "BASE=$IMAGE" -t "$tag" .
          if [ "$PUSH" = true ]; then docker push "$tag"; fi
      # Only a tagged release is signed with the release key (ADR 0024); every other build gets a
      # debug key of its own. The key exists on the runner only for this step.
      - name: Build the APK
        env:
          RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.cargo/registry ~/.gradle core/target
          signing=""
          if [ "$RELEASE" = true ]; then
            if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "A release needs the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets" >&2
              exit 1
            fi
            keys="$(mktemp -d)"
            trap 'rm -rf "$keys"' EXIT
            printf '%s' "$KEYSTORE" | base64 -d > "$keys/release.keystore"
            signing="-v $keys:/keys:ro -e ORQWA_RELEASE_KEYSTORE=/keys/release.keystore"
            signing="$signing -e ORQWA_RELEASE_KEYSTORE_PASSWORD"
          fi
          export ORQWA_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          # shellcheck disable=SC2086 # signing is a list of docker options, or empty
          docker run --rm \
            -e CARGO_INCREMENTAL=0 \
            -e ORQWA_BRANCH \
            -e ORQWA_COMMIT \
            $signing \
            -v "$PWD:/workspaces/orqwa" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.gradle:/root/.gradle" \
            -w /workspaces/orqwa \
            "$ANDROID_IMAGE" scripts/build-android.sh release
      - name: Hand the build directories back to the runner's user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" core/target ~/.cargo/registry ~/.gradle dist
      - uses: actions/upload-artifact@v7
        with:
          path: dist/ORQWA-android-arm64.apk
          archive: false

  # A tag changes no version: the release must come from a commit already naming the tag's.
  # Fails in seconds, beside the builds rather than before them, so branch runs wait for nothing.
  version:
    name: Tag names the version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/release/version.py --tag "$GITHUB_REF_NAME"

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [version, checks, macos, windows, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Preserve the single-file uploads as release archives, including ZIPs that the
      # download action would otherwise extract into their contents.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Publish all app and CLI archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh scripts/release/publish.sh
