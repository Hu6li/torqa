name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

# A newer push to the same branch or PR makes the running checks moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Dev image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # One image per Dockerfile: built the first time that Dockerfile is seen, pulled after.
      - id: tag
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "tag=ghcr.io/$owner/torqa-dev:$(sha256sum .devcontainer/Dockerfile | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # A PR from a fork has a read-only token: it uses the image as it is, or the checks job
      # builds its own if the Dockerfile changed.
      - name: Build and push the image if GHCR lacks it
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "$TAG is there already"
            exit 0
          fi
          docker build -t "$TAG" .devcontainer
          docker push "$TAG"

  checks:
    name: Checks (dev container)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      # The build directory and the crate registry carry over between runs, as the devcontainer's
      # volumes do for a developer: a cold build (FFmpeg from source and the whole workspace)
      # takes about 20 minutes, a warm one a fraction of that. The Dockerfile is in the key, as
      # it pins the Rust toolchain that built what is cached.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ hashFiles('.devcontainer/Dockerfile') }}
          cache-directories: app/.godot
      - name: Pull the dev image, or build it for a fork PR with a changed Dockerfile
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          docker pull "$IMAGE" || docker build -t "$IMAGE" .devcontainer
      - name: fmt, clippy, test, deny, gdlint in the dev container
        run: |
          mkdir -p ~/.cargo/registry core/target app/.godot
          docker run --rm \
            -v "$PWD:/workspaces/torqa" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -w /workspaces/torqa \
            "$IMAGE" scripts/check.sh
      # The container runs as root; the cache step must be able to prune what it saves.
      - name: Hand the build directory back to the runner's user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" core/target app/.godot ~/.cargo/registry

  macos:
    name: macOS app (arm64)
    # Docker on macOS has no Bluetooth/Metal, so macOS builds happen natively on the runner.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # FFmpeg is built from source into the extension (ADR 0010); its assembly needs nasm.
      - name: Install FFmpeg build tools
        run: brew install nasm
      - name: Build GDExtension
        run: scripts/build-gdext.sh release
      - name: Build CLI
        run: |
          cargo build --manifest-path core/Cargo.toml -p torqa-cli --release --locked
          mkdir -p dist
          # Artifacts drop the executable bit; a tarball keeps it.
          tar -czf dist/torqa-cli-macos-arm64.tar.gz -C core/target/release torqa-cli
      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates_dir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates_dir"
          unzip -q -j templates.tpz "templates/macos.zip" "templates/version.txt" -d "$templates_dir"
      - name: Export app
        run: |
          mkdir -p dist
          godot="$PWD/Godot.app/Contents/MacOS/Godot"
          # Godot 4.7.2 on macOS runners crashes in MoltenVK on a cold headless editor start
          # (godotengine/godot#123723), but only after .godot/ has been seeded; warm runs work.
          "$godot" --headless --path app --import || echo "Cold import crashed (known 4.7.2 issue), continuing"
          test -d app/.godot
          "$godot" --headless --path app --export-release "macOS" "$PWD/dist/Torqa-macos-arm64.zip"
          test -s dist/Torqa-macos-arm64.zip
      # Both files are archives already; upload them as-is instead of zipping them again.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Torqa-macos-arm64.zip
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/torqa-cli-macos-arm64.tar.gz
          archive: false

  windows:
    name: Windows app (x86_64)
    # FFmpeg's configure rejects the target OS ffmpeg-sys-next passes when cross-compiling
    # ("windows"), so the extension is built natively with MSVC, like the macOS one.
    runs-on: windows-latest
    # A cold build (FFmpeg from source plus the workspace) takes about 15 minutes.
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.2"
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # FFmpeg's build needs a POSIX sh, make and nasm: from the runner's preinstalled MSYS2.
      - name: Install FFmpeg build tools
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make diffutils nasm
      # The MSVC environment (cl.exe, link.exe, INCLUDE, LIB) for FFmpeg's configure
      # (--toolchain=msvc) comes from Visual Studio's own dev shell. PATH order: Visual Studio
      # first (its link.exe must win over coreutils' link), then MSYS2 (FFmpeg's makefiles need
      # MSYS2's make, sh and awk; other makes on the image mangle their quoting), then the rest.
      # Git's own sh and coreutils come out so the build uses one MSYS2 runtime (git.exe stays).
      - name: Build GDExtension and CLI
        run: |
          $before = $env:PATH -split ';'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          $vsPaths = $env:PATH -split ';' | Where-Object { $_ -and $before -notcontains $_ }
          $rest = $before | Where-Object { $_ -and $_ -notmatch '\\Git\\(usr\\)?bin\\?$' }
          $env:PATH = (@($vsPaths) + 'C:\msys64\usr\bin' + @($rest)) -join ';'
          Get-Command cl, link, make, sh, awk, nasm | Format-Table Name, Source -AutoSize
          sh scripts/build-gdext.sh release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --manifest-path core/Cargo.toml -p torqa-cli --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive core/target/release/torqa-cli.exe dist/torqa-cli-windows-x86_64.zip
      # Cargo only shows configure's summary; the cause of a failed FFmpeg build is in its log.
      - name: Show FFmpeg configure log
        if: failure()
        run: |
          Get-ChildItem core/target -Recurse -Filter config.log -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'ffbuild' } |
            ForEach-Object { Write-Output "== $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
      - name: Install Godot and export templates
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable"
          curl.exe -fsSL -o godot.zip "$base/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          Expand-Archive godot.zip -DestinationPath godot
          curl.exe -fsSL -o templates.zip "$base/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz"
          $templates = "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $templates | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("$PWD\templates.zip")
          foreach ($name in 'windows_release_x86_64.exe', 'version.txt') {
            $entry = $zip.GetEntry("templates/$name")
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$templates\$name", $true)
          }
          $zip.Dispose()
      # The console build blocks until Godot exits and forwards its output to the log.
      - name: Export app
        run: |
          $godot = "$PWD\godot\Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          & $godot --headless --path app --import
          New-Item -ItemType Directory -Force dist\Torqa | Out-Null
          & $godot --headless --path app --export-release "Windows Desktop" "$PWD\dist\Torqa\Torqa.exe"
          if (-not (Test-Path dist\Torqa\Torqa.exe) -or -not (Test-Path dist\Torqa\torqa_gd.dll)) {
            Get-ChildItem dist\Torqa
            throw "export is missing Torqa.exe or torqa_gd.dll"
          }
          Compress-Archive dist\Torqa\* dist\Torqa-windows-x86_64.zip
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Torqa-windows-x86_64.zip
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/torqa-cli-windows-x86_64.zip
          archive: false

  linux:
    name: Linux app (${{ matrix.arch }})
    # Built on the oldest supported runner rather than in the dev container (Debian 13): the
    # binaries need the glibc they were linked against or newer, so 22.04's lets them run on
    # Ubuntu 22.04+, Debian 12+ and their peers (ADR 0012).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            preset: Linux
          - arch: arm64
            runner: ubuntu-22.04-arm
            preset: Linux arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # The dev container's build packages: BlueZ's D-Bus for btleplug, libclang and nasm for
      # FFmpeg (ADR 0010), fontconfig for headless Godot.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config libclang-dev nasm libfontconfig1
      - name: Build GDExtension
        run: scripts/build-gdext.sh release
      - name: Build CLI
        run: |
          cargo build --manifest-path core/Cargo.toml -p torqa-cli --release --locked
          mkdir -p dist
          # Artifacts drop the executable bit; a tarball keeps it.
          tar -czf "dist/torqa-cli-linux-${{ matrix.arch }}.tar.gz" -C core/target/release torqa-cli
      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.${{ matrix.arch }}.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.${{ matrix.arch }}" godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates_dir"
          unzip -q -j templates.tpz "templates/linux_release.${{ matrix.arch }}" \
            "templates/version.txt" -d "$templates_dir"
      - name: Export app
        run: |
          ./godot --headless --path app --import
          mkdir -p dist/Torqa
          ./godot --headless --path app --export-release "${{ matrix.preset }}" \
            "$PWD/dist/Torqa/Torqa.${{ matrix.arch }}"
          test -x "dist/Torqa/Torqa.${{ matrix.arch }}"
          test -s dist/Torqa/libtorqa_gd.so
          tar -czf "dist/Torqa-linux-${{ matrix.arch }}.tar.gz" -C dist Torqa
      # The exported app itself, not the editor: it must start, load the extension and run the
      # main scene without errors on the oldest glibc it is built for.
      - name: Smoke test the exported app
        run: |
          output="$(dist/Torqa/Torqa.${{ matrix.arch }} --headless --quit-after 10 2>&1)"
          echo "$output"
          if echo "$output" | grep -q "SCRIPT ERROR\|SHADER ERROR\|^ERROR:"; then
            echo "Torqa reported errors" >&2
            exit 1
          fi
          echo "$output" | grep -q "^Torqa "
          core/target/release/torqa-cli --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Torqa-linux-${{ matrix.arch }}.tar.gz
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/torqa-cli-linux-${{ matrix.arch }}.tar.gz
          archive: false
