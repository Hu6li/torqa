; The Android export preset (ADR 0024), added to the Android build's copy of the project only.
; PRESET is replaced by the next free preset number.
[preset.PRESET]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""

[preset.PRESET.options]

gradle_build/use_gradle_build=true
gradle_build/min_sdk="29"
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="org.orqwa.bike"
package/name="ORQWA"
package/signed=true
screen/immersive_mode=true
; Written by stage.py. Android tints only the monochrome layer's alpha, which the foreground has.
launcher_icons/adaptive_foreground_432x432="res://icon_foreground.svg"
launcher_icons/adaptive_background_432x432="res://icon_background.svg"
launcher_icons/adaptive_monochrome_432x432="res://icon_foreground.svg"
