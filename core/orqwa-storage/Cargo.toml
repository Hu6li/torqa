[package]
name = "orqwa-storage"
description = "Storage for ORQWA: FIT export, course files, rider profiles and their accounts, the history index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets the fuzzer reach the parsers behind the signature check (ADR 0043); never in builds.
fuzzing = []

[dependencies]
orqwa-domain.workspace = true
orqwa-licence.workspace = true
orqwa-world.workspace = true
rusqlite.workspace = true
rustyfit.workspace = true
embedded-io-adapters.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
zip.workspace = true

[dev-dependencies]
orqwa-licence = { workspace = true, features = ["dev-keys"] }

[lints]
workspace = true
