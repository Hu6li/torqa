[package]
name = "orqwa-net"
description = "Bounded peer-to-peer group ride networking for ORQWA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes the property checks the fuzz targets in core/fuzz drive; never enabled in builds.
fuzzing = []
# Lets other crates' tests lose a rider's connection as a failing network would (#434);
# never enabled in builds.
testing = []

[dependencies]
base64.workspace = true
netdev.workspace = true
orqwa-domain.workspace = true
quinn.workspace = true
rcgen.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "macros", "rt", "sync", "fs", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
