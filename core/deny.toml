# Dependency policy (see CLAUDE.md): GPL-compatible licenses only, no unmaintained crates.

[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # `paste`, a finished compile-time macro, used by every release of rav1d (the AV1 decoder,
    # ADR 0010); unmaintained, not vulnerable. Revisit when rav1d drops it.
    { id = "RUSTSEC-2024-0436", reason = "compile-time macro of rav1d, unmaintained but finished" },
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Every entry must be compatible with GPL-3.0.
allow = [
    "GPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Mozilla CA root certificates (webpki-root-certs, via reqwest TLS): permissive data license.
    "CDLA-Permissive-2.0",
    # FFmpeg's Rust bindings (ffmpeg-next, ffmpeg-sys-next); permissive, GPL-compatible (FSF).
    "WTFPL",
    # Public-domain dedication (to_method, via rav1d); GPL-compatible (FSF).
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
