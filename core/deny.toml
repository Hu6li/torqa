# Dependency policy (see CLAUDE.md): GPL-compatible licenses only, no unmaintained crates.

[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Every entry must be compatible with GPL-3.0.
allow = [
    "GPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Mozilla CA root certificates (webpki-root-certs, via reqwest TLS): permissive data license.
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
