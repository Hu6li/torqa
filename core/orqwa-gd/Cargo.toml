[package]
name = "orqwa-gd"
description = "Godot GDExtension bindings exposing the ORQWA core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Opens worlds sealed with the development keys, such as the test world: scripts/build-gdext.sh
# turns it on for debug and test builds, never for release ones (ADR 0043).
dev-keys = ["orqwa-licence/dev-keys"]

[dependencies]
orqwa-app.workspace = true
orqwa-licence.workspace = true
orqwa-devices.workspace = true
orqwa-domain.workspace = true
orqwa-physics.workspace = true
orqwa-routes.workspace = true
orqwa-session.workspace = true
orqwa-workouts.workspace = true
orqwa-world.workspace = true
godot.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk-context.workspace = true
rustls-platform-verifier.workspace = true

[lints]
workspace = true
