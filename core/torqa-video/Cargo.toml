[package]
name = "torqa-video"
description = "Video decoding for Torqa's video ride mode, built on FFmpeg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ffmpeg-next.workspace = true
quick-xml.workspace = true
rav1d.workspace = true
thiserror.workspace = true

# rav1d's x86 assembly (assembled with nasm): the pure Rust decoder alone cannot keep up with a
# 720p video on a laptop (ADR 0010).
[target.'cfg(target_arch = "x86_64")'.dependencies]
rav1d = { workspace = true, features = ["asm"] }

[features]
# Test videos for other crates' tests.
testing = []

[lints]
workspace = true
