[package]
name = "torqa-video"
description = "Video decoding for Torqa's video ride mode, built on FFmpeg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ffmpeg-next.workspace = true
quick-xml.workspace = true
rav1d.workspace = true
thiserror.workspace = true

# rav1d's assembly, for speed: everywhere but Linux on ARM, where it cannot be linked into a
# shared library (the GDExtension); there the pure Rust decoder is used.
[target.'cfg(not(all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
rav1d = { workspace = true, features = ["asm", "asm_arm64_dotprod", "asm_arm64_i8mm"] }

[features]
# Test videos for other crates' tests.
testing = []

[lints]
workspace = true
