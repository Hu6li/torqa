[workspace]
resolver = "3"
members = ["orqwa-domain", "orqwa-terrain", "orqwa-video", "orqwa-osm", "orqwa-routes", "orqwa-physics", "orqwa-devices", "orqwa-storage", "orqwa-workouts", "orqwa-session", "orqwa-world", "orqwa-upload", "orqwa-remote", "orqwa-update", "orqwa-app", "orqwa-gd", "orqwa-cli", "orqwa-net", "orqwa-voice"]

[workspace.package]
version = "0.5.4"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
orqwa-app = { path = "orqwa-app" }
orqwa-domain = { path = "orqwa-domain" }
orqwa-net = { path = "orqwa-net" }
orqwa-osm = { path = "orqwa-osm" }
orqwa-devices = { path = "orqwa-devices" }
orqwa-physics = { path = "orqwa-physics" }
orqwa-routes = { path = "orqwa-routes" }
orqwa-session = { path = "orqwa-session" }
orqwa-storage = { path = "orqwa-storage" }
orqwa-terrain = { path = "orqwa-terrain" }
orqwa-upload = { path = "orqwa-upload" }
orqwa-update = { path = "orqwa-update" }
orqwa-remote = { path = "orqwa-remote" }
orqwa-video = { path = "orqwa-video" }
orqwa-workouts = { path = "orqwa-workouts" }
orqwa-world = { path = "orqwa-world" }
orqwa-voice = { path = "orqwa-voice" }
anyhow = "1.0.104"
base64 = "0.23.1"
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
cpal = { version = "0.18.2", default-features = false }
opusic-c = "1.6.1"
# FFmpeg's libraries come prebuilt by scripts/build-ffmpeg.sh (a pinned release, verified),
# found through FFMPEG_DIR and linked statically (ADR 0010).
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling", "static"] }
# QR codes for pairing a phone with the remote (#228); no image output, Godot draws it.
fast_qr = { version = "0.14.0", default-features = false }
# zlib through zlib-rs, as zip already has it: the blobs of OpenStreetMap's PBF files.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
embedded-io-adapters = { version = "0.7.0", features = ["std"] }
futures = "0.3.34"
geo-types = "0.7.20"
image-webp = "0.2.4"
mvt-reader = "2.5.0"
netdev = "0.47.0"
# Already used by CPAL; its embedded Android host needs the app's VM/context initialized.
ndk-context = "0.1.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }
png = "0.18.1"
# Protocol Buffers for OpenStreetMap's PBF files; already in use under mvt-reader.
prost = "0.14.4"
quick-xml = "0.42.0"
# Without its assembly here: the 1.1.0 package leaves out the headers its ARM assembly needs.
# orqwa-video turns it on for x86_64, whose assembly the package has (ADR 0010).
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
reqwest = "0.13.5"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
# SQLite compiled in: no system library to find on any platform (ADR 0002, R79).
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustyfit = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
godot = "0.5.5"
# Android only (ADR 0024): Bluetooth through btleplug needs Java's environment once at start.
jni = "0.22.4"
# Android only (ADR 0024): reqwest's certificate checks go through Android, set up once at start.
rustls-platform-verifier = "0.7.1"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Tests build synthetic worlds: optimized they run several times faster, debug assertions
# still on. Line tables keep the backtraces readable without the full debug info's size.
[profile.test]
opt-level = 2
debug = "line-tables-only"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
