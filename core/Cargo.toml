[workspace]
resolver = "3"
members = ["torqa-domain", "torqa-gd", "torqa-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
torqa-domain = { path = "torqa-domain" }
godot = "0.5.5"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
